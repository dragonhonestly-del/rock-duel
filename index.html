<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chain Duel Game</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background-color: #111114; color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .timer-badge { background-color: #25D366; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; margin-bottom: 10px; }
        .timer-number { font-size: 48px; font-weight: bold; margin-bottom: 10px; }
        .progress-bar-container { width: 100%; max-width: 400px; height: 10px; background-color: #2c2c35; border-radius: 5px; margin-bottom: 30px; overflow: hidden; }
        .progress-bar { width: 100%; height: 100%; background-color: #ff3b30; transition: width 1s linear; }
        .game-card { background-color: #1c1c24; border-radius: 15px; padding: 20px; width: 100%; max-width: 400px; box-sizing: border-box; text-align: center; }
        .status-text { color: #a0a0ab; font-size: 14px; margin-bottom: 20px; }
        .target-label { color: #a0a0ab; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }
        .target-word { color: #ffcc00; font-size: 32px; font-weight: bold; text-transform: uppercase; margin-bottom: 20px; }
        .input-field { width: 100%; background-color: transparent; border: 2px solid #ff3b30; border-radius: 10px; color: white; padding: 15px; font-size: 16px; box-sizing: border-box; margin-bottom: 15px; text-align: center; }
        .input-field::placeholder { color: #555; }
        .action-btn { width: 100%; background-color: #ff3b30; color: white; border: none; border-radius: 10px; padding: 15px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .action-btn:active { opacity: 0.8; }
        
        #connection-screen { display: flex; flex-direction: column; width: 100%; max-width: 400px; gap: 10px; margin-top: 50px; }
        .btn-blue { background-color: #007aff; }
    </style>
</head>
<body>
    <!-- Экран подключения -->
    <div id="connection-screen">
        <h2 style="text-align: center;">Дуэль ⚔️</h2>
        <button class="action-btn btn-blue" onclick="createRoom()">Создать комнату</button>
        <p style="text-align: center; color: #a0a0ab;">ИЛИ</p>
        <input type="text" id="room-code" class="input-field" placeholder="Код комнаты..." style="border-color:#007aff;">
        <button class="action-btn btn-blue" onclick="joinRoom()">Присоединиться</button>
        <p id="room-id-display" style="text-align: center; color: #25D366; font-weight: bold; margin-top: 20px;"></p>
    </div>

    <!-- Экран игры -->
    <div id="game-screen" style="display: none; width: 100%; display: flex; flex-direction: column; align-items: center; margin-top: 20px;">
        <div class="timer-badge" id="turn-badge">🔥 ТВОЙ ХОД!</div>
        <div class="timer-number" id="timer-display">30</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="timer-bar"></div>
        </div>

        <div class="game-card">
            <div class="status-text" id="judge-status">✅ Игра началась!</div>
            <div class="target-label">ЧТО УНИЧТОЖИТ ЭТО:</div>
            <div class="target-word" id="current-word">КАМЕНЬ</div>
            
            <input type="text" id="word-input" class="input-field" placeholder="Что это перебьет?.." autocomplete="off">
            <button class="action-btn" onclick="sendWord()" id="send-btn">УДАРИТЬ 💥</button>
        </div>
    </div>

    <script>
        // API-ключ Gemini
        const GEMINI_API_KEY = "AQ.Ab8RN6KlkMg-Vsk7Opxn75RR9VCaqPu3D-w6cFwrq-RY5PEUNTLQ"; 
        
        let peer = null;
        let conn = null;
        let isMyTurn = false;
        let currentTarget = "камень";
        let usedWords = ["камень"];
        
        let maxTime = 30;
        let timeLeft = 30;
        let turnCount = 0;
        let timerInterval = null;

        const connScreen = document.getElementById('connection-screen');
        const gameScreen = document.getElementById('game-screen');
        const roomIdDisplay = document.getElementById('room-id-display');
        const wordInput = document.getElementById('word-input');
        const currentWordDisplay = document.getElementById('current-word');
        const judgeStatus = document.getElementById('judge-status');
        const timerDisplay = document.getElementById('timer-display');
        const timerBar = document.getElementById('timer-bar');
        const turnBadge = document.getElementById('turn-badge');
        const sendBtn = document.getElementById('send-btn');

        // === СТРОГИЙ ИИ СУДЬЯ ===
        async function judgeWithAI(prevWord, newWord) {
            if (!GEMINI_API_KEY) {
                return { valid: true, reason: `✅ «${newWord}» принято` };
            }
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                const prompt = `Ты предельно строгий, душный и логичный судья в игре "Что бьет камень".
Предыдущий объект/явление: "${prevWord}".
Новый ответ игрока: "${newWord}".

Правило: Ответ игрока обязан логически, физически, механически или химически уничтожать, ломать, растворять, тушить или однозначно побеждать предыдущий объект.
- Никаких абстракций и абсолютов: "Бог", "Вселенная", "Ничто", "Время", "Черная дыра", "Смерть" — сразу ОТКАЗ (valid: false).
- Стихии без явного превосходства (ураган против цунами, вулкан против солнца) — сразу ОТКАЗ (valid: false).
- Ошибки, слабые ассоциации, нелепые натягивания совы на глобус — сразу ОТКАЗ (valid: false).
- Только прямая победа (например: вода тушит огонь, кирка ломает камень, ржавчина точит металл).

Ответь ИСКЛЮЧИТЕЛЬНО строгим форматом JSON: {"valid": true/false, "reason": "короткий едкий комментарий на русском до 8 слов"}`;

                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                let text = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
                return JSON.parse(text);
            } catch (e) {
                console.error(e);
                return { valid: true, reason: `💥 «${newWord}» засчитано!` };
            }
        }

        // === СЕТЕВАЯ ЛОГИКА ===
        function initPeer(id = null) {
            peer = new Peer(id);
            peer.on('open', (id) => {
                roomIdDisplay.innerText = "Твой код: " + id + "\nСкопируй и отправь другу!";
            });
            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
            });
        }

        function createRoom() {
            initPeer();
            isMyTurn = true; 
        }

        function joinRoom() {
            const code = document.getElementById('room-code').value.trim();
            if (!code) return alert("Введите код комнаты!");
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(code);
                setupConnection();
            });
            isMyTurn = false; 
        }

        function setupConnection() {
            conn.on('open', () => {
                connScreen.style.display = 'none';
                gameScreen.style.display = 'flex';
                updateUI();
                if(isMyTurn) startTimer();
            });
            
            conn.on('data', (data) => {
                if (data.type === 'move') {
                    currentTarget = data.word;
                    usedWords.push(data.word.toLowerCase());
                    judgeStatus.innerText = data.reason;
                    turnCount = data.turnCount;
                    maxTime = data.maxTime;
                    
                    isMyTurn = true;
                    wordInput.value = "";
                    updateUI();
                    startTimer();
                } else if (data.type === 'lose') {
                    stopTimer();
                    alert("🎉 ТЫ ПОБЕДИЛ! Противник: " + data.reason);
                    location.reload();
                }
            });
        }

        // === ИГРОВАЯ ЛОГИКА ===
        async function sendWord() {
            if (!isMyTurn) return;
            const newWord = wordInput.value.trim().toLowerCase();
            if (!newWord) return;

            sendBtn.disabled = true;
            sendBtn.innerText = "СУДЬЯ ДУМАЕТ...";
            stopTimer(); 

            if (usedWords.includes(newWord)) {
                lose(`Слово "${newWord}" уже было!`);
                return;
            }

            const verdict = await judgeWithAI(currentTarget, newWord);
            
            if (verdict.valid) {
                currentTarget = newWord.toUpperCase();
                usedWords.push(newWord);
                
                turnCount++;
                if (turnCount % 2 === 0 && maxTime > 5) {
                    maxTime -= 5; 
                }

                isMyTurn = false;
                updateUI();
                
                conn.send({
                    type: 'move',
                    word: currentTarget,
                    reason: verdict.reason,
                    turnCount: turnCount,
                    maxTime: maxTime
                });
                
                judgeStatus.innerText = "⏳ Ожидание противника...";
            } else {
                lose(`Судья отклонил: ${verdict.reason}`);
            }
        }

        function lose(reason) {
            alert("❌ ТЫ ПРОИГРАЛ! " + reason);
            conn.send({ type: 'lose', reason: reason });
            location.reload();
        }

        // === ТАЙМЕР И ИНТЕРФЕЙС ===
        function startTimer() {
            timeLeft = maxTime;
            updateTimerUI();
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if (timeLeft <= 0) {
                    lose("Время вышло!");
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function updateTimerUI() {
            timerDisplay.innerText = timeLeft;
            const percent = (timeLeft / maxTime) * 100;
            timerBar.style.width = percent + '%';
        }

        function updateUI() {
            currentWordDisplay.innerText = currentTarget;
            if (isMyTurn) {
                turnBadge.style.backgroundColor = "#25D366";
                turnBadge.innerText = `🔥 ТВОЙ ХОД! (${maxTime} сек)`;
                wordInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.innerText = "УДАРИТЬ 💥";
                sendBtn.style.backgroundColor = "#ff3b30";
                wordInput.focus();
            } else {
                turnBadge.style.backgroundColor = "#555";
                turnBadge.innerText = "⏳ ХОД ПРОТИВНИКА";
                wordInput.disabled = true;
                sendBtn.disabled = true;
                sendBtn.innerText = "ЖДЕМ...";
                sendBtn.style.backgroundColor = "#555";
            }
        }
        
        wordInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                sendBtn.click();
            }
        });
    </script>
</body>
</html>
