<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chain Duel Game</title>
    <!-- PeerJS для P2P связи -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Официальный SDK Google Gen AI для поддержки AQ-ключей -->
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #111114; 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }
        
        .screen {
            display: none;
            width: 100%;
            max-width: 400px;
            flex-direction: column;
            align-items: center;
        }
        .screen.active { display: flex; }

        #lobby-screen { margin-top: 25px; gap: 14px; }
        .title { font-size: 28px; font-weight: 800; margin-bottom: 5px; text-align: center; }
        .subtitle { color: #a0a0ab; font-size: 13px; text-align: center; margin-bottom: 5px; }
        
        .input-field { 
            width: 100%; 
            background-color: #1c1c24; 
            border: 2px solid #007aff; 
            border-radius: 12px; 
            color: white; 
            padding: 15px; 
            font-size: 17px; 
            text-align: center; 
            outline: none;
        }
        .input-field::placeholder { color: #555; }
        
        .api-box {
            width: 100%;
            background-color: #181820;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
        }
        .api-label { font-size: 12px; color: #8e8e99; margin-bottom: 6px; display: block; text-align: center; }
        .api-input {
            width: 100%;
            background-color: #111114;
            border: 1px solid #444;
            border-radius: 8px;
            color: #25D366;
            padding: 10px;
            font-size: 13px;
            text-align: center;
            outline: none;
        }

        .action-btn { 
            width: 100%; 
            background-color: #007aff; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            padding: 16px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        .action-btn:active { opacity: 0.7; }
        .action-btn:disabled { background-color: #444 !important; color: #888; cursor: not-allowed; }
        
        #lobby-status { color: #25D366; font-weight: bold; text-align: center; margin-top: 10px; min-height: 24px; font-size: 14px; }

        /* Экран игры */
        #game-screen { margin-top: 15px; }
        .timer-badge { 
            background-color: #25D366; 
            color: white; 
            padding: 6px 16px; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: 14px; 
            margin-bottom: 10px; 
        }
        .timer-number { font-size: 52px; font-weight: 800; margin-bottom: 10px; line-height: 1; }
        .progress-bar-container { 
            width: 100%; 
            height: 10px; 
            background-color: #2c2c35; 
            border-radius: 5px; 
            margin-bottom: 25px; 
            overflow: hidden; 
        }
        .progress-bar { width: 100%; height: 100%; background-color: #ff3b30; transition: width 0.3s linear; }
        
        .game-card { 
            background-color: #1c1c24; 
            border-radius: 18px; 
            padding: 22px; 
            width: 100%; 
            text-align: center; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .status-text { color: #e0e0e6; font-size: 15px; margin-bottom: 18px; min-height: 22px; line-height: 1.3; }
        .target-label { color: #8e8e99; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 8px; }
        .target-word { color: #ffcc00; font-size: 34px; font-weight: 900; text-transform: uppercase; margin-bottom: 22px; word-break: break-word; }
        
        .game-input { border-color: #ff3b30; margin-bottom: 15px; background-color: #14141a; }
        .btn-red { background-color: #ff3b30; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ВХОД В КОМНАТУ -->
    <div id="lobby-screen" class="screen active">
        <div class="title">Chain Duel ⚔️</div>
        <div class="subtitle">Введи одинаковый код комнаты с другом (напр. 999)</div>
        
        <input type="text" id="room-code-input" class="input-field" placeholder="Код комнаты (напр. 999)" autocomplete="off">
        <button id="join-btn" class="action-btn" onclick="connectToRoom()">Войти в комнату</button>

        <div class="api-box">
            <span class="api-label">🔑 Ключ ИИ-судьи (AQ-токен, сохраняется в телефоне):</span>
            <input type="password" id="api-key-input" class="api-input" placeholder="Вставь свой ключ (AQ...)" onchange="saveApiKey()">
        </div>
        
        <div id="lobby-status"></div>
    </div>

    <!-- ЭКРАН 2: САМА ИГРА -->
    <div id="game-screen" class="screen">
        <div class="timer-badge" id="turn-badge">🔥 ТВОЙ ХОД!</div>
        <div class="timer-number" id="timer-display">30</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="timer-bar"></div>
        </div>

        <div class="game-card">
            <div class="status-text" id="judge-status">✅ Дуэль началась!</div>
            <div class="target-label">ЧТО УНИЧТОЖИТ ЭТО:</div>
            <div class="target-word" id="current-word">КАМЕНЬ</div>
            
            <input type="text" id="word-input" class="input-field game-input" placeholder="Что это перебьет?.." autocomplete="off">
            <button class="action-btn btn-red" id="send-btn" onclick="submitMove()">УДАРИТЬ 💥</button>
        </div>
    </div>

    <script type="module">
        import { GoogleGenAI } from "@google/genai";

        let peer = null;
        let conn = null;
        let isHost = false;
        let isMyTurn = false;

        let currentWord = "КАМЕНЬ";
        let usedWords = ["камень"];
        let maxTime = 30;
        let timeLeft = 30;
        let turnCount = 0;
        let timerInterval = null;

        const lobbyScreen = document.getElementById('lobby-screen');
        const gameScreen = document.getElementById('game-screen');
        const lobbyStatus = document.getElementById('lobby-status');
        const joinBtn = document.getElementById('join-btn');
        const roomInput = document.getElementById('room-code-input');
        const apiKeyInput = document.getElementById('api-key-input');

        const turnBadge = document.getElementById('turn-badge');
        const timerDisplay = document.getElementById('timer-display');
        const timerBar = document.getElementById('timer-bar');
        const judgeStatus = document.getElementById('judge-status');
        const currentWordEl = document.getElementById('current-word');
        const wordInput = document.getElementById('word-input');
        const sendBtn = document.getElementById('send-btn');

        window.onload = () => {
            const savedKey = localStorage.getItem('duel_gemini_key');
            if (savedKey) apiKeyInput.value = savedKey;
        };

        window.saveApiKey = function() {
            const val = apiKeyInput.value.trim();
            localStorage.setItem('duel_gemini_key', val);
        }

        // === 1. ЛОГИКА ОНЛАЙНА ===
        window.connectToRoom = function() {
            saveApiKey();
            const rawCode = roomInput.value.trim().toLowerCase();
            if (!rawCode) {
                alert("Введи код комнаты!");
                return;
            }
            
            const roomPeerId = "rock-duel-v3-" + rawCode.replace(/[^a-z0-9а-яё]/gi, '');
            joinBtn.disabled = true;
            roomInput.disabled = true;
            lobbyStatus.style.color = "#ffcc00";
            lobbyStatus.innerText = "⏳ Подключение к комнате «" + rawCode + "»...";

            peer = new Peer(roomPeerId);

            peer.on('open', () => {
                isHost = true;
                isMyTurn = true;
                lobbyStatus.style.color = "#25D366";
                lobbyStatus.innerText = "✅ Комната «" + rawCode + "» создана!\nЖдем друга...";
            });

            peer.on('connection', (incomingConn) => {
                conn = incomingConn;
                setupConnectionHandlers();
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    lobbyStatus.style.color = "#007aff";
                    lobbyStatus.innerText = "🔗 Комната найдена! Входим к другу...";
                    joinAsGuest(roomPeerId);
                } else {
                    lobbyStatus.style.color = "#ff3b30";
                    lobbyStatus.innerText = "❌ Ошибка сети: " + err.type;
                    joinBtn.disabled = false;
                    roomInput.disabled = false;
                }
            });
        }

        function joinAsGuest(hostPeerId) {
            isHost = false;
            isMyTurn = false;
            peer = new Peer();

            peer.on('open', () => {
                conn = peer.connect(hostPeerId, { reliable: true });
                setupConnectionHandlers();
            });

            peer.on('error', (err) => {
                lobbyStatus.style.color = "#ff3b30";
                lobbyStatus.innerText = "❌ Ошибка входа: " + err.type;
                joinBtn.disabled = false;
                roomInput.disabled = false;
            });
        }

        function setupConnectionHandlers() {
            conn.on('open', () => {
                lobbyScreen.classList.remove('active');
                gameScreen.classList.add('active');
                updateUI();
                startTimer();
            });

            conn.on('data', (data) => {
                if (data.type === 'request_judge') {
                    handleMoveAsHost(data.word);
                } else if (data.type === 'move_accepted') {
                    applyAcceptedMove(data.word, data.reason, data.nextIsHost, data.maxTime, data.turnCount);
                } else if (data.type === 'move_rejected') {
                    handleRejectedMove(data.reason);
                } else if (data.type === 'game_over') {
                    stopTimer();
                    alert(data.winnerIsHost === isHost ? "🎉 ПОБЕДА! " + data.reason : "💀 ПОРАЖЕНИЕ! " + data.reason);
                    location.reload();
                }
            });

            conn.on('close', () => {
                stopTimer();
                alert("⚠️ Друг вышел из игры.");
                location.reload();
            });
        }

        // === 2. СУДЬЯ ЧЕРЕЗ ОФИЦИАЛЬНЫЙ SDK (ПОДДЕРЖКА AQ-ТОКЕНОВ) ===
        async function judgeWithAI(prevWord, newWord) {
            const p = prevWord.toLowerCase().trim();
            const n = newWord.toLowerCase().trim();

            if (n.length < 2) {
                return { valid: false, reason: "Слишком короткое слово!" };
            }
            const banned = ["бог", "вселенная", "всё", "все", "ничто", "бесконечность", "админ", "смерть"];
            if (banned.includes(n)) {
                return { valid: false, reason: `Абстракции и читы запрещены!` };
            }

            const apiKey = apiKeyInput.value.trim() || localStorage.getItem('duel_gemini_key') || "";
            if (!apiKey) {
                return { valid: false, reason: "Введи ключ Gemini API на старте!" };
            }

            const systemPrompt = `Ты строгий, объективный и бескомпромиссный судья в игре "Что бьет камень".
Текущее слово: "${prevWord}".
Ответ игрока: "${newWord}".

Правила:
1. Если "${newWord}" физически, химически, логически или по классическим правилам ПОБЕЖДАЕТ, ЛОМАЕТ или КОНТРИТ "${prevWord}" — верни valid: true.
2. Если "${newWord}" СЛАБЕЕ, не связано по смыслу или это бессмыслица — верни valid: false!

Ответь СТРОГО в формате JSON без markdown:
{"valid": true или false, "reason": "короткое объяснение до 8 слов"}`;

            try {
                // Инициализируем SDK прямо с AQ-токеном пользователя
                const ai = new GoogleGenAI({ apiKey: apiKey });

                const response = await ai.models.generateContent({
                    model: 'gemini-1.5-flash',
                    contents: systemPrompt,
                    config: {
                        temperature: 0.1,
                        responseMimeType: "application/json"
                    }
                });

                let rawText = response.text.trim();
                rawText = rawText.replace(/```json|```/gi, '').trim();
                const parsed = JSON.parse(rawText);

                return {
                    valid: Boolean(parsed.valid),
                    reason: parsed.reason || (parsed.valid ? `«${newWord}» бьет «${prevWord}»!` : `«${newWord}» слабо против «${prevWord}»!`)
                };
            } catch (err) {
                console.error("SDK Judge error:", err);
                return { valid: false, reason: "Ошибка ключа или лимитов ИИ!" };
            }
        }

        // === 3. ХОДЫ И ИГРОВАЯ ЛОГИКА ===
        window.submitMove = async function() {
            if (!isMyTurn) return;
            const newWord = wordInput.value.trim();
            if (!newWord) return;

            const cleanWord = newWord.toLowerCase();
            if (usedWords.includes(cleanWord)) {
                judgeStatus.style.color = "#ff3b30";
                judgeStatus.innerText = `❌ Слово уже было!`;
                wordInput.value = "";
                return;
            }

            sendBtn.disabled = true;
            wordInput.disabled = true;
            sendBtn.innerText = "СУДЬЯ ДУМАЕТ...";

            if (isHost) {
                await handleMoveAsHost(newWord);
            } else {
                conn.send({ type: 'request_judge', word: newWord });
            }
        }

        async function handleMoveAsHost(newWord) {
            const cleanWord = newWord.toLowerCase();
            if (usedWords.includes(cleanWord)) {
                const msg = `Слово уже было!`;
                if (isMyTurn) handleRejectedMove(msg);
                else conn.send({ type: 'move_rejected', reason: msg });
                return;
            }

            const verdict = await judgeWithAI(currentWord, newWord);

            if (verdict.valid) {
                turnCount++;
                if (turnCount % 2 === 0 && maxTime > 8) {
                    maxTime = Math.max(8, maxTime - 3);
                }
                const nextIsHost = !isMyTurn;

                conn.send({
                    type: 'move_accepted',
                    word: newWord.toUpperCase(),
                    reason: verdict.reason,
                    nextIsHost: nextIsHost,
                    maxTime: maxTime,
                    turnCount: turnCount
                });

                applyAcceptedMove(newWord.toUpperCase(), verdict.reason, nextIsHost, maxTime, turnCount);
            } else {
                if (isMyTurn) handleRejectedMove(verdict.reason);
                else conn.send({ type: 'move_rejected', reason: verdict.reason });
            }
        }

        function applyAcceptedMove(newWordUpper, reason, nextIsHost, newMaxTime, newTurnCount) {
            currentWord = newWordUpper;
            usedWords.push(newWordUpper.toLowerCase());
            maxTime = newMaxTime;
            turnCount = newTurnCount;
            isMyTurn = (isHost === nextIsHost);

            judgeStatus.style.color = "#25D366";
            judgeStatus.innerText = `✅ 💥 ${reason}`;
            wordInput.value = "";

            updateUI();
            startTimer();
        }

        function handleRejectedMove(reason) {
            judgeStatus.style.color = "#ff3b30";
            judgeStatus.innerText = `❌ Судья: ${reason}`;
            wordInput.disabled = false;
            sendBtn.disabled = false;
            sendBtn.innerText = "УДАРИТЬ 💥";
            wordInput.select();
            wordInput.focus();
        }

        // === 4. ТАЙМЕР ===
        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = maxTime;
            updateTimerUI();

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (isMyTurn) {
                        const winnerIsHost = !isHost;
                        const reason = `Время вышло!`;
                        conn.send({ type: 'game_over', winnerIsHost: winnerIsHost, reason: reason });
                        alert(`💀 ВРЕМЯ ВЫШЛО! Ты не успел побить «${currentWord}».`);
                        location.reload();
                    }
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function updateTimerUI() {
            timerDisplay.innerText = timeLeft;
            const percent = Math.max(0, (timeLeft / maxTime) * 100);
            timerBar.style.width = percent + '%';
        }

        function updateUI() {
            currentWordEl.innerText = currentWord;
            if (isMyTurn) {
                turnBadge.style.backgroundColor = "#25D366";
                turnBadge.innerText = `🔥 ТВОЙ ХОД! (${maxTime} сек)`;
                wordInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.innerText = "УДАРИТЬ 💥";
                wordInput.focus();
            } else {
                turnBadge.style.backgroundColor = "#555";
                turnBadge.innerText = `⏳ ХОД ДРУГА (${maxTime} сек)`;
                wordInput.disabled = true;
                sendBtn.disabled = true;
                sendBtn.innerText = "ЖДЕМ ДРУГА...";
            }
        }

        wordInput.addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                e.preventDefault();
                submitMove();
            }
        });
    </script>
</body>
</html>
