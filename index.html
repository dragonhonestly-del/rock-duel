<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chain Duel Game</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #111114; 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }
        
        /* Экраны (жестко скрываем неактивные) */
        .screen {
            display: none;
            width: 100%;
            max-width: 400px;
            flex-direction: column;
            align-items: center;
        }
        .screen.active {
            display: flex;
        }

        /* Экран входа */
        #lobby-screen { margin-top: 40px; gap: 15px; }
        .title { font-size: 28px; font-weight: 800; margin-bottom: 10px; text-align: center; }
        .subtitle { color: #a0a0ab; font-size: 14px; text-align: center; margin-top: -10px; margin-bottom: 10px; }
        
        .input-field { 
            width: 100%; 
            background-color: #1c1c24; 
            border: 2px solid #007aff; 
            border-radius: 12px; 
            color: white; 
            padding: 16px; 
            font-size: 18px; 
            text-align: center; 
            outline: none;
        }
        .input-field::placeholder { color: #555; }
        
        .action-btn { 
            width: 100%; 
            background-color: #007aff; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            padding: 16px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: opacity 0.2s;
        }
        .action-btn:active { opacity: 0.7; }
        .action-btn:disabled { background-color: #444 !important; color: #888; cursor: not-allowed; }
        
        #lobby-status { color: #25D366; font-weight: bold; text-align: center; margin-top: 15px; min-height: 24px; }

        /* Экран игры */
        #game-screen { margin-top: 15px; }
        .timer-badge { 
            background-color: #25D366; 
            color: white; 
            padding: 6px 16px; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: 14px; 
            margin-bottom: 10px; 
        }
        .timer-number { font-size: 52px; font-weight: 800; margin-bottom: 10px; line-height: 1; }
        .progress-bar-container { 
            width: 100%; 
            height: 10px; 
            background-color: #2c2c35; 
            border-radius: 5px; 
            margin-bottom: 25px; 
            overflow: hidden; 
        }
        .progress-bar { width: 100%; height: 100%; background-color: #ff3b30; transition: width 0.3s linear; }
        
        .game-card { 
            background-color: #1c1c24; 
            border-radius: 18px; 
            padding: 22px; 
            width: 100%; 
            text-align: center; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .status-text { color: #e0e0e6; font-size: 15px; margin-bottom: 18px; min-height: 22px; line-height: 1.3; }
        .target-label { color: #8e8e99; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 8px; }
        .target-word { color: #ffcc00; font-size: 34px; font-weight: 900; text-transform: uppercase; margin-bottom: 22px; word-break: break-word; }
        
        .game-input { border-color: #ff3b30; margin-bottom: 15px; background-color: #14141a; }
        .btn-red { background-color: #ff3b30; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ВХОД В КОМНАТУ -->
    <div id="lobby-screen" class="screen active">
        <div class="title">Chain Duel ⚔️</div>
        <div class="subtitle">Введи одинаковый код с другом (например, 999)</div>
        
        <input type="text" id="room-code-input" class="input-field" placeholder="Код комнаты (напр. 999)" autocomplete="off">
        <button id="join-btn" class="action-btn" onclick="connectToRoom()">Войти в комнату</button>
        
        <div id="lobby-status"></div>
    </div>

    <!-- ЭКРАН 2: САМА ИГРА (СКРЫТ ДО ПОДКЛЮЧЕНИЯ ОБОИХ ИГРОКОВ) -->
    <div id="game-screen" class="screen">
        <div class="timer-badge" id="turn-badge">🔥 ТВОЙ ХОД!</div>
        <div class="timer-number" id="timer-display">30</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="timer-bar"></div>
        </div>

        <div class="game-card">
            <div class="status-text" id="judge-status">✅ Дуэль началась!</div>
            <div class="target-label">ЧТО УНИЧТОЖИТ ЭТО:</div>
            <div class="target-word" id="current-word">КАМЕНЬ</div>
            
            <input type="text" id="word-input" class="input-field game-input" placeholder="Что это перебьет?.." autocomplete="off">
            <button class="action-btn btn-red" id="send-btn" onclick="submitMove()">УДАРИТЬ 💥</button>
        </div>
    </div>

    <script>
        // === API НАСТРОЙКИ (Точно как в твоих заметках) ===
        const GEMINI_API_KEY = "AQ.Ab8RN6KlkMg-Vsk7Opxn75RR9VCaqPu3D-w6cFwrq-RY5PEUNTLQ";
        const GEMINI_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent";

        // === СОСТОЯНИЕ ИГРЫ ===
        let peer = null;
        let conn = null;
        let isHost = false;
        let isMyTurn = false;

        let currentWord = "КАМЕНЬ";
        let usedWords = ["камень"];
        let maxTime = 30;
        let timeLeft = 30;
        let turnCount = 0;
        let timerInterval = null;

        // Элементы
        const lobbyScreen = document.getElementById('lobby-screen');
        const gameScreen = document.getElementById('game-screen');
        const lobbyStatus = document.getElementById('lobby-status');
        const joinBtn = document.getElementById('join-btn');
        const roomInput = document.getElementById('room-code-input');

        const turnBadge = document.getElementById('turn-badge');
        const timerDisplay = document.getElementById('timer-display');
        const timerBar = document.getElementById('timer-bar');
        const judgeStatus = document.getElementById('judge-status');
        const currentWordEl = document.getElementById('current-word');
        const wordInput = document.getElementById('word-input');
        const sendBtn = document.getElementById('send-btn');

        // === 1. ЛОГИКА ОНЛАЙНА ПО КОДУ КОМНАТЫ (НАПР. 999) ===
        function connectToRoom() {
            const rawCode = roomInput.value.trim().toLowerCase();
            if (!rawCode) {
                alert("Введи код комнаты!");
                return;
            }
            
            const roomPeerId = "rock-duel-room-" + rawCode.replace(/[^a-z0-9а-яё]/gi, '');
            joinBtn.disabled = true;
            roomInput.disabled = true;
            lobbyStatus.style.color = "#ffcc00";
            lobbyStatus.innerText = "⏳ Создаем или ищем комнату «" + rawCode + "»...";

            // Пытаемся стать Хостом этой комнаты
            peer = new Peer(roomPeerId);

            peer.on('open', (id) => {
                // Мы первые в этой комнате -> мы Хост!
                isHost = true;
                isMyTurn = true;
                lobbyStatus.style.color = "#25D366";
                lobbyStatus.innerText = "✅ Комната «" + rawCode + "» создана!\nЖдем, пока друг введет «" + rawCode + "» и нажмет Войти...";
            });

            peer.on('connection', (incomingConn) => {
                // К нам подключился друг!
                conn = incomingConn;
                setupConnectionHandlers();
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    // Комната с таким кодом УЖЕ создана другом! Подключаемся к нему как Гость
                    lobbyStatus.style.color = "#007aff";
                    lobbyStatus.innerText = "🔗 Комната найдена! Подключаемся к другу...";
                    joinAsGuest(roomPeerId);
                } else {
                    lobbyStatus.style.color = "#ff3b30";
                    lobbyStatus.innerText = "❌ Ошибка сети: " + err.type;
                    joinBtn.disabled = false;
                    roomInput.disabled = false;
                }
            });
        }

        function joinAsGuest(hostPeerId) {
            isHost = false;
            isMyTurn = false;
            peer = new Peer(); // Гостю генерируем любой ID

            peer.on('open', () => {
                conn = peer.connect(hostPeerId, { reliable: true });
                setupConnectionHandlers();
            });

            peer.on('error', (err) => {
                lobbyStatus.style.color = "#ff3b30";
                lobbyStatus.innerText = "❌ Не удалось подключиться: " + err.type;
                joinBtn.disabled = false;
                roomInput.disabled = false;
            });
        }

        function setupConnectionHandlers() {
            conn.on('open', () => {
                // Оба в комнате — скрываем меню и включаем игру!
                lobbyScreen.classList.remove('active');
                gameScreen.classList.add('active');
                updateUI();
                startTimer();
            });

            conn.on('data', (data) => {
                if (data.type === ' request_judge') {
                    // Гость прислал ход Хосту на проверку
                    handleMoveAsHost(data.word);
                } else if (data.type === 'move_accepted') {
                    // Ход одобрен! Обновляем состояние у обоих
                    applyAcceptedMove(data.word, data.reason, data.nextIsHost, data.maxTime, data.turnCount);
                } else if (data.type === 'move_rejected') {
                    // Судья отклонил слово Гостя
                    handleRejectedMove(data.reason);
                } else if (data.type === 'game_over') {
                    stopTimer();
                    alert(data.winnerIsHost === isHost ? "🎉 ПОБЕДА! " + data.reason : "💀 ПОРАЖЕНИЕ! " + data.reason);
                    location.reload();
                }
            });

            conn.on('close', () => {
                stopTimer();
                alert("⚠️ Друг отключился от комнаты.");
                location.reload();
            });
        }

        // === 2. СТРОГИЙ ИИ-МОДЕРАТОР (GEMINI API) ===
        async function judgeWithAI(prevWord, newWord) {
            const systemPrompt = `Ты строгий, объективный и бескомпромиссный судья в игре "Что бьет камень".
Текущее слово на столе: "${prevWord}".
Игрок пытается побить его словом: "${newWord}".

Твоя задача — жестко проверить, действительно ли "${newWord}" физически, химически, логически или по смыслу УНИЧТОЖАЕТ, ЛОМАЕТ, ПОБЕЖДАЕТ или КОНТРИТ "${prevWord}".

СТРОГИЕ ПРАВИЛА ОТКАЗА (valid: false):
1. Если предмет СЛАБЕЕ или равен предыдущему (например: "ураган" НЕ бьет "цунами", "нож" НЕ бьет "танк", "камень" НЕ бьет "лаву", "ветерок" НЕ бьет "скалу") — СТРОГО valid: false!
2. Если игрок написал бессмыслицу, набор букв ("ываыва"), опечатку, из-за которой слово не понять, или то же самое слово — СТРОГО valid: false!
3. Если это читерские абстракции без конкретики ("Бог", "Вселенная", "Бесконечность", "Всё", "Админ", "Смерть") — СТРОГО valid: false!
4. Если связь притянута за уши и в реальности "${newWord}" никак не может уничтожить или остановить "${prevWord}" — СТРОГО valid: false!

ОДОБРЕНИЕ (valid: true):
Только если "${newWord}" реально сильнее или является прямой контрой для "${prevWord}" (например: "вода" тушит "огонь", "динамитной шашкой" взрывают "камень", "бункер" спасает от "ракеты").

Верни ответ СТРОГО в формате JSON без markdown-оберток:
{"valid": true или false, "reason": "короткое и четкое объяснение на русском (до 8 слов), почему бьет или почему это бред"}`;

            try {
                // Используем и заголовок X-goog-api-key (как в твоих заметках), и параметр key для 100% совместимости
                const response = await fetch(`${GEMINI_URL}?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-goog-api-key': GEMINI_API_KEY
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: systemPrompt }]
                        }],
                        generationConfig: {
                            temperature: 0.1,
                            responseMimeType: "application/json"
                        }
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    console.error("API Error:", errText);
                    return { valid: false, reason: "Ошибка связи с ИИ-судьей (" + response.status + ")" };
                }

                const data = await response.json();
                let rawText = data.candidates[0].content.parts[0].text.trim();
                rawText = rawText.replace(/```json|```/gi, '').trim();
                const parsed = JSON.parse(rawText);

                return {
                    valid: Boolean(parsed.valid),
                    reason: parsed.reason || (parsed.valid ? `«${newWord}» перебивает «${prevWord}»!` : `«${newWord}» слабее чем «${prevWord}»!`)
                };
            } catch (err) {
                console.error("Judge exception:", err);
                return { valid: false, reason: "ИИ не понял ответ, попробуй другое слово!" };
            }
        }

        // === 3. ОБРАБОТКА ХОДОВ ===
        async function submitMove() {
            if (!isMyTurn) return;
            const newWord = wordInput.value.trim();
            if (!newWord) return;

            const cleanWord = newWord.toLowerCase();
            if (usedWords.includes(cleanWord)) {
                judgeStatus.style.color = "#ff3b30";
                judgeStatus.innerText = `❌ Слово «${newWord}» уже использовали! Пиши другое!`;
                wordInput.value = "";
                return;
            }

            // Блокируем кнопку пока думает ИИ
            sendBtn.disabled = true;
            wordInput.disabled = true;
            sendBtn.innerText = "СУДЬЯ ПРОВЕРЯЕТ...";

            if (isHost) {
                await handleMoveAsHost(newWord);
            } else {
                // Гость отправляет слово Хосту, чтобы судил один источник
                conn.send({ type: ' request_judge', word: newWord });
            }
        }

        async function handleMoveAsHost(newWord) {
            const cleanWord = newWord.toLowerCase();
            if (usedWords.includes(cleanWord)) {
                const msg = `Слово «${newWord}» уже было!`;
                if (isMyTurn) {
                    handleRejectedMove(msg);
                } else {
                    conn.send({ type: 'move_rejected', reason: msg });
                }
                return;
            }

            const verdict = await judgeWithAI(currentWord, newWord);

            if (verdict.valid) {
                // Слово подошло! Передаем ход
                turnCount++;
                if (turnCount % 2 === 0 && maxTime > 8) {
                    maxTime = Math.max(8, maxTime - 3); // Сжимаем таймер каждые 2 хода
                }
                const nextIsHost = !isMyTurn; // Если ходил Хост, следующий — Гость, и наоборот

                conn.send({
                    type: 'move_accepted',
                    word: newWord.toUpperCase(),
                    reason: verdict.reason,
                    nextIsHost: nextIsHost,
                    maxTime: maxTime,
                    turnCount: turnCount
                });

                applyAcceptedMove(newWord.toUpperCase(), verdict.reason, nextIsHost, maxTime, turnCount);
            } else {
                // ИИ ОТКЛОНИЛ СЛОВО! Игрок не вылетает сразу, но теряет драгоценное время таймера и должен придумать нормальную контру!
                if (isMyTurn) {
                    handleRejectedMove(verdict.reason);
                } else {
                    conn.send({ type: 'move_rejected', reason: verdict.reason });
                }
            }
        }

        function applyAcceptedMove(newWordUpper, reason, nextIsHost, newMaxTime, newTurnCount) {
            currentWord = newWordUpper;
            usedWords.push(newWordUpper.toLowerCase());
            maxTime = newMaxTime;
            turnCount = newTurnCount;
            isMyTurn = (isHost === nextIsHost);

            judgeStatus.style.color = "#25D366";
            judgeStatus.innerText = `✅ 💥 ${reason}`;
            wordInput.value = "";

            updateUI();
            startTimer();
        }

        function handleRejectedMove(reason) {
            judgeStatus.style.color = "#ff3b30";
            judgeStatus.innerText = `❌ Судья: ${reason}`;
            wordInput.disabled = false;
            sendBtn.disabled = false;
            sendBtn.innerText = "УДАРИТЬ 💥";
            wordInput.select();
            wordInput.focus();
        }

        // === 4. ТАЙМЕР И ИНТЕРФЕЙС ===
        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = maxTime;
            updateTimerUI();

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    // Если время вышло на моем ходу — я проиграл
                    if (isMyTurn) {
                        const winnerIsHost = !isHost;
                        const reason = `У противника вышло время на слове «${currentWord}»!`;
                        conn.send({ type: 'game_over', winnerIsHost: winnerIsHost, reason: reason });
                        alert(`💀 ВРЕМЯ ВЫШЛО! Ты не успел перебить «${currentWord}».`);
                        location.reload();
                    }
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function updateTimerUI() {
            timerDisplay.innerText = timeLeft;
            const percent = Math.max(0, (timeLeft / maxTime) * 100);
            timerBar.style.width = percent + '%';
        }

        function updateUI() {
            currentWordEl.innerText = currentWord;
            if (isMyTurn) {
                turnBadge.style.backgroundColor = "#25D366";
                turnBadge.innerText = `🔥 ТВОЙ ХОД! (${maxTime} сек)`;
                wordInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.innerText = "УДАРИТЬ 💥";
                wordInput.focus();
            } else {
                turnBadge.style.backgroundColor = "#555";
                turnBadge.innerText = `⏳ ХОД ДРУГА (${maxTime} сек)`;
                wordInput.disabled = true;
                sendBtn.disabled = true;
                sendBtn.innerText = "ЖДЕМ ДРУГА...";
            }
        }

        wordInput.addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                e.preventDefault();
                submitMove();
            }
        });
    </script>
</body>
</html>
